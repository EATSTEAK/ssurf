name: iOS Deployment

on:
  push:
    tags:
      - 'v*' # v로 시작하는 시멘틱 버전 (예: v1.0.0)
      - 'b*' # b로 시작하는 빌드 번호 (예: b2025122701)
  workflow_dispatch:
    inputs:
      lane:
        description: '배포 레인'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release

jobs:
  build-and-deploy:
    name: iOS 빌드 및 배포
    runs-on: macos-26

    steps:
      - name: 디스크 공간 확보
        run: |
          echo "디스크 공간 확인 (정리 전):"
          df -h

          # 불필요한 소프트웨어 제거
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf ~/Library/Android

          echo "디스크 공간 확인 (정리 후):"
          df -h

      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: 태그 정보 추출
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            
            # v*.*.* 형태의 시멘틱 버전이면 release
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "lane=release" >> $GITHUB_OUTPUT
              echo "배포 타입: Release (시멘틱 버전)"
            # b로 시작하는 빌드 번호면 beta (TestFlight)
            elif [[ "$TAG" =~ ^b[0-9]+ ]]; then
              echo "lane=beta" >> $GITHUB_OUTPUT
              echo "배포 타입: Beta (빌드 번호)"
            else
              echo "lane=beta" >> $GITHUB_OUTPUT
              echo "배포 타입: Beta (기타)"
            fi
          fi

      - name: pnpm 설치
        uses: pnpm/action-setup@v5

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (iOS)
        run: pnpm expo prebuild -p ios --clean

      - name: Push entitlement 제거
        run: |
          while IFS= read -r -d '' file; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$file" || true
            echo "updated $file"
          done < <(find ios -name "*.entitlements" -print0)

      - name: Ruby 설정 (Fastlane용)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Fastlane 의존성 설치
        working-directory: fastlane
        run: |
          bundle install

      - name: 배포 레인 결정
        id: lane
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "lane=${{ github.event.inputs.lane }}" >> $GITHUB_OUTPUT
          else
            echo "lane=${{ steps.tag.outputs.lane }}" >> $GITHUB_OUTPUT
          fi

      - name: Fastlane으로 빌드 및 배포
        working-directory: fastlane
        run: bundle exec fastlane ios ${{ steps.lane.outputs.lane }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            ios/build/
            fastlane/logs/
            fastlane/report.xml
            ~/Library/Logs/gym/
          retention-days: 30
          if-no-files-found: warn

      - name: 배포 완료 알림
        if: success()
        run: |
          echo "🎉 iOS 배포가 완료되었습니다!"
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "태그: ${{ steps.tag.outputs.tag }}"
          fi
          echo "레인: ${{ steps.lane.outputs.lane }}"
